# O portão, fora do deploy.
#
# `deploy.yml` já roda `npm run build`, e o build começa pelos verificadores. Só
# que ele dispara em push para main: um ramo de trabalho ou um pull request
# passava sem ninguém conferir, e o erro só aparecia depois de já estar em main.
# Aqui os mesmos verificadores rodam em qualquer ramo e em todo PR, em ~1,6 s,
# sem build e sem publicar nada.
#
# E EM MAIN TAMBEM, desde 04/09/2026. Ate aqui o gatilho era `branches-ignore:
# [main]`, e a consequencia era que **o smoke do navegador nao rodava no fluxo
# normal do projeto**, que e push direto em main: o `deploy.yml` roda `npm run
# build` (validadores + astro build) e nao roda `npm run smoke`. Com a maquina de
# desenvolvimento sem conseguir buildar (ver o crash do compilador do Astro no
# Windows), o smoke tinha parado de ser executado por qualquer um.
name: Validar dados e regras

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    # UM TETO, porque o smoke dirige um navegador e navegador trava.
    #
    # Sem isto, um passo pendurado consome o teto padrão do GitHub (seis horas)
    # e o portão fica "in_progress" em vez de vermelho, que é a mesma doença de
    # sempre: um estado que não é resposta parecendo resposta. Vinte minutos são
    # umas cinco vezes o que ele leva numa máquina modesta.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      # O smoke do tabuleiro sobe a bancada (banco de mentira) e dirige um
      # navegador. Na máquina de alguém ele PULA com código zero quando não acha
      # nenhum, porque faltar Edge não é defeito do código.
      #
      # AQUI ELE NÃO PODE PULAR. `SMOKE_EXIGE_NAVEGADOR=1` faz a falta de
      # navegador virar falha: um portão que passa pulando é pior do que não ter
      # portão, porque diz verde sem ter olhado.
      - name: Smoke do Grid
        run: npm run smoke
        env:
          CHROME: /usr/bin/google-chrome
          SMOKE_EXIGE_NAVEGADOR: '1'
      # Os tipos não travam o build hoje (há erros antigos fora dos módulos do
      # tabuleiro). Roda assim mesmo, para a lista aparecer no log e não crescer
      # em silêncio.
      - name: Tipos (informativo)
        run: npx tsc --noEmit
        continue-on-error: true
